<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Riverside Internal Header</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0D0D1F;
      color: #fff;
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .logo-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .logo-text {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #fff;
    }

    .logo-text span {
      color: #6C47FF;
    }

    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin-bottom: 20px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .label {
      font-size: 14px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
    }

    .sublabel {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.35);
      margin-top: 3px;
      font-family: 'SF Mono', 'Menlo', monospace;
    }

    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .slider {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      transition: background 0.2s ease;
    }

    .slider:before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      top: 3px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    input:checked + .slider {
      background: #6C47FF;
    }

    input:checked + .slider:before {
      transform: translateX(20px);
      background: #fff;
    }

    .status {
      font-size: 11px;
      margin-top: 16px;
      padding: 8px 10px;
      border-radius: 7px;
      text-align: center;
      transition: all 0.2s ease;
    }

    .status.on {
      background: rgba(108, 71, 255, 0.15);
      color: #9B7BFF;
    }

    .status.off {
      background: rgba(255, 255, 255, 0.05);
      color: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <div class="logo-icon">
        <img src="icons/riverside-logo.png" alt="Riverside">
      </div>
      <div class="logo-text">Riverside<span>.</span></div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="row">
    <div>
      <div class="label">Internal Header</div>
      <div class="sublabel">x-riverside-internal</div>
    </div>
    <label class="toggle">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
